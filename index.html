<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9b82e6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="나의 가계부"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><title>나의 가계부 · Expense Log</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#2e2540;background:#f6f2ff}*{box-sizing:border-box}body{margin:0}.app{max-width:560px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 18px calc(30px + env(safe-area-inset-bottom))}header{padding:30px 2px 14px;display:flex;align-items:center;justify-content:space-between}.eyebrow{color:#8b76bb;font-size:12px;font-weight:700;letter-spacing:1.5px}h1{font-size:27px;margin:4px 0 0}.panel{background:white;border:1px solid #eee6ff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #6e4c9b0a}.monthbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.monthbar strong{font-size:18px}button{cursor:pointer;font:inherit;border:0}.round{border-radius:12px;background:#f2ecff;color:#6749a3;width:40px;height:40px;font-size:23px}.label{font-size:13px;color:#786e8a;font-weight:600}.income-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}.income-row input{width:65%;text-align:right;font-size:23px;font-weight:700}input{min-width:0;border:1px solid #e7dff4;border-radius:10px;padding:11px;background:#fff;color:#30233f;font:inherit}input:focus{outline:2px solid #b59be9;border-color:transparent}.currency{font-size:16px;color:#746789}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}h2{font-size:17px;margin:0}.subtle{color:#978aa9;font-size:12px}.entry{display:grid;grid-template-columns:minmax(0,1fr) 135px 34px;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid #f2eef8}.entry:last-child{border-bottom:0}.entry .name{font-size:15px}.entry .amt{width:100%;text-align:right;font-size:15px;font-variant-numeric:tabular-nums}.delete{background:transparent;color:#a59bb5;font-size:22px}.primary{width:100%;background:#8e70d4;color:white;border-radius:13px;padding:14px;font-weight:700;margin-top:15px}.secondary{background:#f1ebfc;color:#65499c;border-radius:12px;padding:11px 13px;font-size:13px;font-weight:650}.totals{background:#efe7ff}.sumrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0}.sumrow strong{font-variant-numeric:tabular-nums}.sumrow.balance{border-top:1px solid #d8c9f1;margin-top:7px;padding-top:15px;font-size:19px}.negative{color:#c24864}.positive{color:#5636a3}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{flex:1}.hint{font-size:12px;color:#8e829d;line-height:1.7;margin:16px 4px}dialog{border:0;border-radius:20px;padding:22px;width:min(92vw,420px);box-shadow:0 20px 80px #35204755}dialog::backdrop{background:#24133588}dialog h2{margin-bottom:18px}dialog label{display:block;margin:12px 0 6px;font-size:13px}dialog input{width:100%}.dialog-actions{display:flex;gap:8px;margin-top:18px}.dialog-actions button{flex:1}.empty{padding:20px 0;text-align:center;color:#9b8cab;font-size:14px}@media(max-width:360px){.entry{grid-template-columns:minmax(0,1fr) 112px 26px;gap:5px}.app{padding-left:12px;padding-right:12px}}
 .copybar{display:flex;gap:8px;margin-top:12px}.copybar button{flex:1}.entry{grid-template-columns:minmax(0,1fr) minmax(85px,125px) 30px}.entry.editing{display:block;border:1px solid #e9dff7;border-radius:13px;padding:10px;margin:8px 0}.edit-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,125px);gap:8px}.edit-tools{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.edit-tools button{border-radius:8px;padding:7px 9px;background:#f2ecff;color:#62469b;font-size:12px}.edit-tools .remove{color:#b33758;background:#fff0f4}.edit-tools button:disabled{opacity:.35}.edit-help{font-size:12px;color:#817391;margin:8px 0}.entry:not(.editing) .delete{display:none}.entry:not(.editing){grid-template-columns:minmax(0,1fr) minmax(90px,135px)}.smallrow{display:flex;justify-content:space-between;align-items:center;gap:8px}.smallrow .secondary{white-space:nowrap} </style></head><body><main class="app"><header><div><div class="eyebrow">MY SIMPLE BUDGET</div><h1>Expense Log 💜</h1></div><button class="round" id="today" aria-label="이번 달로 이동">⌂</button></header><section class="panel monthbar"><button class="round" id="prev" aria-label="이전 달">‹</button><strong id="month"></strong><button class="round" id="next" aria-label="다음 달">›</button></section><section class="panel"><div class="label">이번 달 수입</div><div class="income-row"><input type="text" inputmode="numeric" id="income" aria-label="이번 달 수입" placeholder="0"><span class="currency">원</span></div></section><section class="panel"><div class="sectiontitle"><h2>지출 내역</h2><button class="secondary" id="edit">✎ 편집</button></div><div class="smallrow"><span class="subtle" id="count"></span><span class="subtle" id="editnote"></span></div><div class="copybar"><button class="secondary" id="prevCopy">↳ 이전 달 가져오기</button><button class="secondary" id="otherCopy">다른 달 복사</button></div><div id="entries"></div><button class="primary" id="add">＋ 맨 아래에 항목 추가</button></section><section class="panel totals"><div class="sumrow"><span>총지출</span><strong id="expense">0원</strong></div><div class="sumrow balance"><b>남은 금액</b><strong id="balance">0원</strong></div></section><section class="panel"><div class="sectiontitle"><h2>기록 보관</h2></div><div class="actions"><button class="secondary" id="export">백업 저장</button><button class="secondary" id="import">백업 불러오기</button><button class="secondary" id="copy">이번 달 복사</button></div><input type="file" id="file" accept="application/json,.json" hidden><p class="hint">기록은 이 기기의 브라우저에 자동 저장됩니다. 브라우저 데이터 삭제·기기 변경에 대비해 백업 파일을 별도로 보관해 주세요.</p></section></main><dialog id="modal"><form id="form"><h2>지출 항목 추가</h2><label for="newname">항목명</label><input id="newname" required maxlength="60" placeholder="예: 식비"><label for="newamount">금액 (원)</label><input id="newamount" type="text" inputmode="numeric" required placeholder="예: 300000"><div class="dialog-actions"><button type="button" class="secondary" id="cancel">취소</button><button type="submit" class="primary" style="margin:0">추가하기</button></div></form></dialog><dialog id="copyModal"><form id="copyForm"><h2>다른 달 기록 복사</h2><label for="sourceMonth">복사할 달</label><input id="sourceMonth" type="month" required><p class="hint">선택한 달의 수입과 지출 항목을 현재 보고 있는 달에 복사합니다. 원본은 변경되지 않습니다. 현재 달에 기록이 있다면 덮어쓰기 전에 확인합니다.</p><div class="dialog-actions"><button type="button" class="secondary" id="copyCancel">취소</button><button type="submit" class="primary" style="margin:0">복사하기</button></div></form></dialog><script>(()=>{'use strict';
const KEY='simple-expense-log-v1', $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const parse=s=>Math.max(0,Math.min(999999999999,Number(String(s).replace(/[^0-9]/g,''))||0));
const date=new Date();let y=date.getFullYear(),m=date.getMonth()+1,editing=false,insertAt=null,data={};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object'&&!Array.isArray(saved))data=saved}catch(e){}
const key=()=>`${y}-${String(m).padStart(2,'0')}`;
const getMonth=k=>{if(!data[k]||typeof data[k]!=='object')data[k]={income:0,items:[]};if(!Array.isArray(data[k].items))data[k].items=[];return data[k]};
const month=()=>getMonth(key());
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('저장에 실패했습니다. 저장 공간을 확인하고 백업해 주세요.')}};
function btn(label,action,disabled=false,cls=''){const b=document.createElement('button');b.type='button';b.textContent=label;b.className=cls;b.disabled=disabled;b.addEventListener('click',action);return b}
function totals(){const d=month(),sum=d.items.reduce((s,x)=>s+parse(x.amount),0),bal=parse(d.income)-sum;$('expense').textContent=fmt(sum)+'원';$('balance').textContent=(bal<0?'-':'')+fmt(Math.abs(bal))+'원';$('balance').className=bal<0?'negative':'positive'}
function render(){ $('month').textContent=`${y}년 ${m}월`;const d=month();$('income').value=fmt(parse(d.income));$('count').textContent=`${d.items.length}개 항목`;$('edit').textContent=editing?'✓ 편집 완료':'✎ 편집';$('editnote').textContent=editing?'위·아래 이동 및 삽입 가능':'';const wrap=$('entries');wrap.replaceChildren();if(!d.items.length){const p=document.createElement('div');p.className='empty';p.textContent='아직 지출 항목이 없습니다.';wrap.append(p)}
d.items.forEach((item,i)=>{const row=document.createElement('div');row.className='entry'+(editing?' editing':'');const fields=document.createElement('div');fields.className='edit-fields';const name=document.createElement('input');name.className='name';name.value=String(item.name||'');name.setAttribute('aria-label',`항목 ${i+1} 이름`);name.addEventListener('input',()=>{item.name=name.value;save()});const amt=document.createElement('input');amt.className='amt';amt.inputMode='numeric';amt.value=fmt(parse(item.amount));amt.setAttribute('aria-label',`${item.name} 금액`);amt.addEventListener('focus',()=>amt.select());amt.addEventListener('input',()=>{item.amount=parse(amt.value);save();totals()});amt.addEventListener('blur',()=>amt.value=fmt(parse(item.amount)));fields.append(name,amt);row.append(fields);
if(editing){const tools=document.createElement('div');tools.className='edit-tools';tools.append(btn('＋ 위에 추가',()=>openAdd(i)),btn('＋ 아래에 추가',()=>openAdd(i+1)),btn('↑ 위로',()=>move(i,-1),i===0),btn('↓ 아래로',()=>move(i,1),i===d.items.length-1),btn('삭제',()=>{if(confirm(`'${item.name}' 항목을 삭제할까요?`)){d.items.splice(i,1);save();render()}},false,'remove'));row.append(tools)}wrap.append(row)});totals()}
function move(i,delta){const items=month().items,j=i+delta;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];save();render()}
function openAdd(index){insertAt=index;$('form').reset();$('modal').showModal();$('newname').focus()}
function copyMonth(source){const src=data[source];if(!src||!Array.isArray(src.items)){alert('선택한 달에 저장된 기록이 없습니다.');return}if(source===key()){alert('같은 달로 복사할 수 없습니다.');return}const dest=month();if((dest.items.length>0||parse(dest.income)>0)&&!confirm(`${key()}의 기존 수입·지출 기록을 ${source} 기록으로 덮어쓸까요?`))return;data[key()]={income:parse(src.income),items:src.items.map(x=>({name:String(x.name||''),amount:parse(x.amount)}))};save();render();alert(`${source} 기록을 ${key()}에 복사했습니다.`)}
$('income').addEventListener('input',e=>{month().income=parse(e.target.value);save();totals()});$('income').addEventListener('blur',e=>e.target.value=fmt(parse(month().income)));
function shift(n){m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}render()}
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('today').onclick=()=>{y=date.getFullYear();m=date.getMonth()+1;render()};$('edit').onclick=()=>{editing=!editing;render()};$('add').onclick=()=>openAdd(month().items.length);
$('cancel').onclick=()=>$('modal').close();$('form').addEventListener('submit',e=>{e.preventDefault();const name=$('newname').value.trim();if(!name)return;month().items.splice(insertAt===null?month().items.length:insertAt,0,{name,amount:parse($('newamount').value)});save();$('modal').close();render()});
$('prevCopy').onclick=()=>{const d=new Date(y,m-2,1);copyMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`)};
$('otherCopy').onclick=()=>{$('sourceMonth').value='';$('copyModal').showModal()};$('copyCancel').onclick=()=>$('copyModal').close();$('copyForm').addEventListener('submit',e=>{e.preventDefault();const source=$('sourceMonth').value;if(!source)return;$('copyModal').close();copyMonth(source)});
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'simple-expense-log-v1',months:data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`가계부-백업-${key()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.format!=='simple-expense-log-v1'||!obj.months||typeof obj.months!=='object'||Array.isArray(obj.months))throw Error();const clean={};for(const [k,v] of Object.entries(obj.months)){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(k)||!v||!Array.isArray(v.items)||v.items.length>2000)throw Error();clean[k]={income:parse(v.income),items:v.items.map(x=>({name:String(x.name||'').slice(0,60),amount:parse(x.amount)}))}}if(confirm('현재 저장된 기록을 백업 파일의 기록으로 교체할까요?')){data=clean;save();render();alert('불러왔습니다.')}}catch(err){alert('올바른 가계부 백업 파일이 아닙니다.')}e.target.value=''});
$('copy').onclick=async()=>{const d=month(),sum=d.items.reduce((s,x)=>s+parse(x.amount),0);const t=[`${y}년 ${m}월 가계부`,`수입: ${fmt(parse(d.income))}원`,...d.items.map(x=>`${x.name}: ${fmt(parse(x.amount))}원`),`총지출: ${fmt(sum)}원`,`잔액: ${fmt(parse(d.income)-sum)}원`].join('\n');try{await navigator.clipboard.writeText(t);alert('복사했습니다.')}catch(e){prompt('아래 내용을 복사하세요.',t)}};
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();</script></body></html>
